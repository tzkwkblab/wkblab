# Site settings
title: 若林研究室
description: > # this means to ignore newlines until "baseurl:"
  筑波大学 情報学群 知識情報・図書館学類 知識情報システム主専攻
  若林研究室のホームページです．
baseurl: "/" # the subpath of your site, e.g. /blog/
# url: "http://yourdomain.com" # the base hostname & protocol for your site you most probably don't need to set it

# Build settings
markdown: kramdown
paginate: 5 # pagination based on number of posts
paginate_path: "page/:num"
highlighter: rouge
gems: [jekyll-paginate]

# comments
disqus: # add disqus shortname here

# author info
# add your appropriate info here
author: wkblab # your name
bio:    # your bio
email:
email_md5: # md5 hash of your email
twitter_username:
github_username: wkblab

# Theming options
# These settings are mandatory.
theme:              'blue-pink'
# drawer theming
drawer:
  text_color:       'grey-600'
  header_color:     'blue-500'
  navigation_color: 'grey-200'
# footer theming
footer:
  text_color: 'blue-grey-200'
  color: 'blue-grey-600'

exclude: [vendor]